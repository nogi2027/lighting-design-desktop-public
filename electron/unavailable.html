<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>Workspace unavailable</title>
<style>
  :root { color-scheme: dark; font-family: Avenir, -apple-system, sans-serif; }
  body { margin: 0; background: #101116; color: #f4f4f5; min-height: 100vh; display: grid; place-items: center; }
  main { max-width: 420px; padding: 40px; }
  h1 { font-size: 26px; font-weight: 600; }
  p { color: #b9bbc4; line-height: 1.6; }
  nav { display: flex; gap: 20px; align-items: center; margin-top: 28px; }
  a { color: #f4f4f5; text-underline-offset: 4px; }
  .retry { background: #f4f4f5; color: #101116; padding: 10px 18px; border-radius: 6px; text-decoration: none; }
</style>
<main>
  <h1>Couldn’t load the workspace</h1>
  <p>Try reopening the local workspace. Your shows and recovery copies stay on this computer.</p>
  <nav>
    <a class="retry" href="app://desktop/">Try again</a>

  </nav>
</main>
</html>
